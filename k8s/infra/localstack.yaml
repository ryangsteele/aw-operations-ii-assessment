# LocalStack stands in for AWS in this exercise. Treat this file as given.
apiVersion: v1
kind: Namespace
metadata:
  name: infra
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: infra
  labels:
    app: localstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:4
          env:
            - name: SERVICES
              value: s3,ssm,iam,sts
          ports:
            - containerPort: 4566
          readinessProbe:
            httpGet:
              path: /_localstack/health
              port: 4566
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: localstack
  namespace: infra
spec:
  type: NodePort
  selector:
    app: localstack
  ports:
    - name: edge
      port: 4566
      targetPort: 4566
      nodePort: 30566
