# Local cluster for the exercise. Treat this file as given.
#
# Port mappings:
#   localhost:4566 -> LocalStack (the stand-in for AWS)
#   localhost:8080 -> the shortlink service
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: shortlink
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30566
        hostPort: 4566
        protocol: TCP
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
